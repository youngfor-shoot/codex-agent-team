name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }} / ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        run: |
          python -m unittest discover -s skill/agent-team/scripts -p "test_*.py"
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Validate Skill metadata
        run: python scripts/validate_skill.py skill/agent-team/SKILL.md
      - name: Validate task-packet template and examples
        run: |
          python skill/agent-team/scripts/validate_task_packet.py skill/agent-team/templates/task-packet.md --template
          python skill/agent-team/scripts/validate_task_packet.py examples/in-progress-task-packet.md
          python skill/agent-team/scripts/validate_task_packet.py examples/completed-task-packet.md --require-complete
      - name: Enforce branch coverage contracts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install coverage==7.15.4
          python -m coverage erase
          python -m coverage run --branch --include="*/routing_rules.py,*/validate_task_packet.py" -m unittest discover -s skill/agent-team/scripts -p "test_validate_task_packet.py"
          python -m coverage run --branch --append --include="*/routing_rules.py,*/validate_task_packet.py" -m unittest discover -s scripts -p "test_routing_rules.py"
          python -m coverage report --fail-under=90 scripts/routing_rules.py skill/agent-team/scripts/validate_task_packet.py
          python -m coverage erase
          python -m coverage run --branch --include="*/evidence_loop.py,*/sync-agent-team.py" -m unittest discover -s skill/agent-team/scripts -p "test_evidence_loop.py"
          python -m coverage run --branch --append --include="*/evidence_loop.py,*/sync-agent-team.py" -m unittest discover -s scripts -p "test_sync_agent_team.py"
          python -m coverage report --fail-under=80 skill/agent-team/scripts/evidence_loop.py scripts/sync-agent-team.py
      - name: Lint and type-check
        run: |
          python -m pip install ruff mypy
          ruff check skill/agent-team/scripts scripts
          mypy skill/agent-team/scripts scripts

  cross-platform-installer:
    name: Cross-platform installer (${{ matrix.os }} / ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install, verify, and assert managed files
        shell: bash
        run: |
          destination="$(mktemp -d)/agent-team-runtime"
          python scripts/sync-agent-team.py --mode Install --destination "$destination" --yes
          python scripts/sync-agent-team.py --mode Verify --destination "$destination"
          test -f "$destination/SKILL.md"
          test -f "$destination/templates/task-packet.md"
          test -f "$destination/references/verification-backends.md"

  synchronization-smoke-test:
    name: Synchronization smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Analyze PowerShell scripts
        shell: powershell
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $findings = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error)
          if ($findings.Count -gt 0) {
            $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            throw "PSScriptAnalyzer found $($findings.Count) error-severity issue(s)."
          }
      - name: Install into a temporary runtime copy
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'agent-team-runtime'
          $agentDestination = Join-Path $env:RUNNER_TEMP 'agent-team-workers'
          New-Item -ItemType Directory -Path $agentDestination -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $agentDestination 'unrelated.toml') -Value 'preserve-me'
          Set-Content -LiteralPath (Join-Path $agentDestination 'luna-worker.toml') -Value 'preexisting-profile'
          ./scripts/sync-agent-team.ps1 -Mode Install -Destination $destination -Confirm:$false
          ./scripts/sync-agent-team.ps1 -Mode Verify -Destination $destination
          $global:LASTEXITCODE = 7
          ./scripts/sync-worker-agents.ps1 -Mode Install -Destination $agentDestination -Confirm:$false
          if ($LASTEXITCODE -ne 0) {
            throw 'Successful worker synchronization did not reset the process exit code.'
          }
          ./scripts/sync-worker-agents.ps1 -Mode Verify -Destination $agentDestination
          if ((Get-Content -Raw -LiteralPath (Join-Path $agentDestination 'unrelated.toml')).Trim() -ne 'preserve-me') {
            throw 'Worker synchronization changed an unrelated Agent file.'
          }
          $backupRoot = Join-Path (Split-Path -Parent $agentDestination) '.agent-team-agent-backups'
          if (-not (Get-ChildItem -Recurse -File -LiteralPath $backupRoot -Filter 'luna-worker.toml')) {
            throw 'Worker synchronization did not back up the existing managed profile.'
          }

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [python-tests, cross-platform-installer, synchronization-smoke-test]
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          python - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          failed = [name for name, job in needs.items() if job['result'] not in ('success', 'skipped')]
          if failed:
              print(f"FAILED required jobs: {failed}")
              raise SystemExit(1)
          print("All required jobs passed.")
          PY
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
