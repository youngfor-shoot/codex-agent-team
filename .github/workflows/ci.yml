name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s skill/agent-team/scripts -p "test_*.py"

  synchronization-smoke-test:
    name: Synchronization smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install into a temporary runtime copy
        shell: powershell
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'agent-team-runtime'
          ./scripts/sync-agent-team.ps1 -Mode Install -Destination $destination -Confirm:$false
          ./scripts/sync-agent-team.ps1 -Mode Verify -Destination $destination
